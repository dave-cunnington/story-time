<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lincoln’s Story Time</title>
<!-- Real icon files first: Amazon Kids tiles and bookmarks read these without
     running JavaScript. buddy.js swaps #favicon to a live SVG once the page loads. -->
<link rel="icon" id="favicon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Lincoln’s Story Time">
<meta property="og:image" content="https://story.davecunnington.com/icons/icon-512.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="bar">
  <button id="back" class="icon" aria-label="Back">←</button>
  <h1 id="heading">Lincoln’s Story Time</h1>
  <div id="tools">
    <button id="smaller" class="icon" aria-label="Smaller text">A−</button>
    <button id="bigger" class="icon" aria-label="Bigger text">A+</button>
    <button id="theme" class="icon" aria-label="Day or night">🌙</button>
    <button id="fullscreen" class="icon" aria-label="Full screen" hidden>⛶</button>
  </div>
</header>

<main id="view"></main>

<div id="wordbar" hidden>
  <span id="wordbar-word"></span>
  <button id="wordbar-again" class="wordbar-btn" aria-label="Say it again">🔊 Again</button>
  <button id="wordbar-means" class="wordbar-btn" aria-label="What does it mean?">💡 Meaning</button>
  <button id="wordbar-close" class="icon" aria-label="Close">✕</button>
  <p id="wordbar-meaning" aria-live="polite" hidden></p>
</div>

<script src="buddy.js"></script>
<script src="app.js"></script>
</body>
</html>
